version: "3.9"

services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AI_MODELS_DIR: /app/ai_models
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - ./ai_models:/app/ai_models
    # depends_on:
    #   db:
    #     condition: service_healthy
    restart: unless-stopped


